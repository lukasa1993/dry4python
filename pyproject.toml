[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dry4python"
version = "0.1.0"
description = "Token-based duplication detection for Python"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "lukasa1993"}]
keywords = ["dry", "duplication", "quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
dry4python = "dry4python.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
